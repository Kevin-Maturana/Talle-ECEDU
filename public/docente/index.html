:root{
  --azul:#0F3F8F; --azul-osc:#0A2A63; --azul-xos:#061A42; --azul-cl:#E6EEFB; --azul-md:#2F6BD0;
  --oro:#F5B400; --oro-d:#C48F00; --oro-cl:#FFE9A8; --nar:#F58220; --nar-d:#C2610F;
  --crema:#FFF9EC; --tinta:#0D1B36; --tinta2:#3B4B6E; --gris:#6B7A99; --linea:#D5DEEF;
  --ok:#13805A; --ok-bg:#DDF3E8; --mal:#C93C3C; --mal-bg:#FBE1E1;
  --display:'Barlow Condensed',system-ui,sans-serif; --font:'Figtree',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--azul-xos);color:var(--tinta);font:400 16px/1.5 var(--font);-webkit-text-size-adjust:100%}
h1,h2,h3,h4,p,ul,ol,blockquote{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--oro);outline-offset:2px}
[hidden]{display:none!important}
.ic{flex:none;vertical-align:middle}
.fine{font-size:.85rem;color:var(--gris)} .center{text-align:center}

/* ---------- piezas comunes ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;border:0;border-radius:14px;background:#fff;color:var(--azul);padding:.6em 1.1em;font:800 1.1em/1.1 var(--display);letter-spacing:.01em;cursor:pointer;box-shadow:0 4px 0 var(--linea);min-height:2.7em;transition:transform .08s,box-shadow .08s}
.btn:active:not([disabled]){transform:translateY(3px);box-shadow:0 1px 0 var(--linea)}
.btn.gold{background:var(--oro);color:var(--tinta);box-shadow:0 5px 0 var(--oro-d)}
.btn.gold:active:not([disabled]){box-shadow:0 2px 0 var(--oro-d)}
.btn.ghost{background:transparent;box-shadow:none;border:2px solid currentColor}
.btn.sm{padding:.35em .8em;min-height:2.3em;font-size:1em}
.btn.big{font-size:1.45em;padding:.6em 1.3em}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:.4em;padding:.2em .75em;border-radius:999px;background:rgba(255,255,255,.14);color:#fff;font:800 1.05em/1.3 var(--display);white-space:nowrap}
.chip small{font:700 .75em var(--font);opacity:.85}
.av{display:inline-grid;place-items:center;border-radius:50%;font:800 .95rem/1 var(--display);flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.16),0 0 0 2px #fff}
.av.xs{width:22px;height:22px;font-size:.62rem;box-shadow:inset 0 -2px 0 rgba(0,0,0,.16)} .av.sm{width:32px;height:32px;font-size:.8rem}
.av.md{width:2.6em;height:2.6em;font-size:1.1em} .av.lg{width:3.6em;height:3.6em;font-size:1.3em} .av.xl{width:96px;height:96px;font-size:2.2rem}

.d-sheet{right:0;width:min(38em,96%)} .d-priv>header .btn,.d-sheet>header .btn{background:#fff;color:var(--azul)}
.d-float{position:absolute;left:0;right:0;bottom:0;top:0;pointer-events:none;z-index:25;overflow:hidden}

.d-float .fl{left:auto} .d-float .fl .ic{width:2.3em;height:2.3em;padding:.35em;border-radius:50%;background:#fff;box-shadow:0 .2em 1em rgba(0,0,0,.35)}
.d-float .r-ok .ic{color:var(--azul)} .d-float .r-wow .ic{color:#B8860B} .d-float .r-ask .ic{color:#B55A00} .d-float .r-slow .ic{color:var(--gris)}
@keyframes flo{0%{transform:translate(0,0) scale(.5);opacity:0}10%{opacity:1;transform:scale(1)}100%{transform:translate(var(--dx),-22em);opacity:0}}
.d-float .fl{right:calc(2% + 0px)} 
/* sala de espera */
.d-lobby{display:grid;grid-template-columns:1fr 1.1fr;gap:2.5em;align-items:center;min-height:100%;padding-top:1em}
.d-lobby h1{font:800 3.1em/1 var(--display);margin:.15em 0 .1em} .d-lobby .sub{font-size:1.2em;color:var(--suave);max-width:28em}
.join-box{margin-top:1.4em;background:rgba(255,255,255,.1);border-radius:1.2em;padding:1em 1.3em;display:flex;flex-direction:column;gap:.3em;max-width:30em} .join-box .url{font:800 1.9em/1.1 var(--display);color:var(--oro);word-break:break-all}.join-box .url:empty,.join-box .url.ph{font-size:1em;color:#fff;opacity:.7;font-weight:600}
.lob-r{display:flex;flex-direction:column;gap:1em} .cnt{display:flex;align-items:baseline;gap:.6em} .bigcount{font:800 5.5em/1 var(--display);color:var(--oro)} .cnt span,.cnt-row span{font-size:1.3em;color:var(--suave)}
.wall{display:flex;flex-wrap:wrap;gap:.5em;max-height:26em;overflow:hidden;align-content:flex-start}

.concept.big .c-uses{grid-template-columns:1fr 1fr 1fr;gap:1em}.c-uses .u-t{border-left:6px solid var(--oro)}.c-uses .u-r{border-left:6px solid var(--azul-md)} .concept.big .c-uses>div{background:rgba(255,255,255,.1);box-shadow:none} .concept.big .c-uses b{color:var(--oro-cl);font-size:1.3em} .concept.big .c-uses p{color:#fff;font-size:1.05em}
.concept.big .c-note{color:var(--tinta2)} .concept.big .fchip{font-size:.95em;color:var(--azul)} .concept.big .c-quote{color:var(--tinta)}
.thermo{display:flex;flex-direction:column;gap:.5em;background:rgba(255,255,255,.1);border-radius:1.2em;padding:.8em;position:sticky;top:0}
.thermo>b{font:800 1.2em var(--display);color:var(--oro-cl)}
.tp{display:grid;grid-template-columns:2em 1fr auto;align-items:center;gap:.5em;background:rgba(255,255,255,.12);border-radius:.9em;padding:.35em .7em;font-weight:600;font-size:.92em} .tp b{font:800 1.6em var(--display)}
.tp.r-ask .ic{color:#FFB27A} .tp.r-wow .ic{color:var(--oro)} .tp.r-ok .ic{color:#9DC2FF} .tp.r-slow .ic{color:var(--suave)}
.twarn{background:var(--oro);color:var(--tinta);border-radius:.9em;padding:.5em .7em;font-weight:700;font-size:.9em}
/* retos */
.d-q{display:grid;grid-template-columns:1fr 20em;gap:1.6em;align-items:start}
.dq-l{display:flex;flex-direction:column;gap:.8em;min-width:0} .dq-r{min-width:20em;display:flex;flex-direction:column;gap:.9em;position:sticky;top:0}
.dq-l .viz{padding:.6em .9em}
.qtop{display:flex;align-items:center;gap:1em;justify-content:center;background:rgba(255,255,255,.08);border-radius:1.2em;padding:.8em}
.qs{font:800 1.8em/1.1 var(--display);color:var(--oro)} .qs.ready{animation:pulsec 1.2s ease-in-out infinite} @keyframes pulsec{50%{transform:scale(1.08)}}
.cntcard{background:rgba(255,255,255,.1);border-radius:1.2em;padding:.9em;display:flex;flex-direction:column;gap:.5em}
.cntcard .cc{display:flex;align-items:baseline;gap:.5em} .cntcard .ca{font:800 3.4em/1 var(--display);color:var(--oro)} .cntcard .cn2{color:var(--suave)}
.cbar{height:.7em;border-radius:1em;background:rgba(255,255,255,.18);overflow:hidden} .cbar i{display:block;height:100%;background:var(--oro);width:0;transition:width .4s}
.cntcard .pips{display:flex;flex-wrap:wrap;gap:3px}

.dopt::after{content:'';position:absolute;left:0;bottom:0;height:.45em;width:var(--p);background:rgba(255,255,255,.75);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.dopt .lt{flex:none;display:grid;place-items:center;width:1.9em;height:1.9em;border-radius:50%;background:rgba(255,255,255,.26);font:800 1.3em var(--display)} .dopt .tx{flex:1}
.dopt .cn{font:800 1.2em var(--display);white-space:nowrap}
.dopt.t0{background:var(--azul-md)} .dopt.t1{background:var(--oro);color:var(--tinta)} .dopt.t2{background:var(--nar);color:var(--tinta)} .dopt.t3{background:var(--ok)}
.dopt.dim{opacity:.4} .dopt.right{opacity:1;box-shadow:0 0 0 .22em #fff,0 0 2em rgba(255,255,255,.5)}
.card.key .kv{font:800 2em/1.1 var(--display);color:var(--ok);margin-bottom:.3em} .card.key .exp{background:transparent;box-shadow:none;padding:0}
.fastl{display:flex;align-items:center;gap:.5em;background:var(--oro);color:var(--tinta);border-radius:1em;padding:.6em .8em;font-weight:700}
.dist .drow{display:grid;grid-template-columns:5em 1fr 2.5em;gap:.6em;align-items:center;margin:.3em 0} .dbar{height:1em;background:var(--azul-cl);border-radius:.6em;overflow:hidden;display:block} .dbar i{display:block;height:100%;background:var(--azul-md)} .drow.right .dbar i{background:var(--ok)} .drow.right .dl{color:var(--ok);font-weight:800} .dist .dl{font:800 1.2em var(--display)}

.cnt-row{display:flex;align-items:baseline;gap:.6em;margin-top:.5em} .cnt-row .bigcount{font-size:3em}

.demo{display:flex;flex-direction:column;height:100%}

    const bg = mk('rbg', { 'stroke-width': 8 }), fg = mk('rfg', { 'stroke-width': 8, 'stroke-linecap': 'round', 'stroke-dasharray': L, transform: 'rotate(-90 ' + size / 2 + ' ' + size / 2 + ')' });

  /* datos del grupo: gráfico de fichas y medidas */

/* src/docente.js */
/* Pantalla del docente: es la que se comparte en Teams. Solo aquí se mueve el juego. */
(function () {
  const { el, icon, avatar, first, confetti, ring, cloud, leader, groupPlot, kickerOf, concept, visual, answerText, LETTERS, REACT, podium } = UI;
  const S = window.Stats, C = window.CONTENT;
  const BADGES = () => window.BADGES;

  function DocenteApp(host, hub, opts) {
    opts = opts || {};
    let view = null, sig = '', screen = null, lastEid = 0, idleT = null, privOpen = false;
    const ls = { get(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* sin almacenamiento */ } } };

    const stepOf = v => v.cur || null;
    const scored = s => !!(s && UI.SCORED[s.kind]);

    /* ---------- barra superior ---------- */
    const kick = el('span', { class: 'kk' }), prog = el('i'), cntChip = el('span', { class: 'chip' });
    bar.append(el('div', { class: 'brand' }, [el('span', { class: 'coin-logo sm', 'aria-hidden': 'true' }), el('b', { text: 'Taller ECEDU' }), el('span', { text: 'Explorando las Matemáticas con Herramientas Digitales' })]), kick, el('div', { class: 'progress', 'aria-hidden': 'true' }, [prog]), cntChip);

    /* ---------- controles ---------- */
    const bPrev = el('button', { type: 'button', class: 'btn', onclick: () => hub.admin('prev') }, ['← Anterior']);
    const bMain = el('button', { type: 'button', class: 'btn gold big main', onclick: () => act(primary(view).act) });
    const bClose = el('button', { type: 'button', class: 'btn', onclick: () => hub.admin('close') }, ['Cerrar respuestas']);
    const bExt = el('button', { type: 'button', class: 'btn', onclick: () => hub.admin('extend') }, ['+30 s']);
    const jump = el('select', { 'aria-label': 'Ir a un paso' }, [el('option', { value: '-1', text: 'Sala de espera' })].concat(C.steps.map((s, i) => el('option', { value: String(i), text: (i + 1) + '. ' + (UI.modOf(s.mod) ? UI.modOf(s.mod).title : 'Taller') + ' · ' + kickerOf(s).split(' · ').pop() }))));
    jump.addEventListener('change', () => { hub.admin('goto', { step: Number(jump.value) }); jump.blur(); });
    const bPriv = el('button', { type: 'button', class: 'btn ghost', onclick: () => togglePriv() }, ['Privado']);
    const themeSel = el('select', { 'aria-label': 'Diseño', class: 'themesel' }, Object.keys(UI.THEMES).map(k => el('option', { value: k, text: 'Diseño: ' + UI.THEMES[k].name })));
    themeSel.addEventListener('change', () => { hub.admin('theme', { theme: themeSel.value }); themeSel.blur(); });
    dock.append(bPrev, bMain, bClose, bExt, el('span', { class: 'grow' }), jump, themeSel, bPriv);

    function primary(v) {
      const st = v.state, s = stepOf(v);
      if (!s) return { label: 'Iniciar el taller', act: 'next' };

        if (st.phase === 'ready') return { label: 'Iniciar el reto', act: 'start' };

      }
      if (st.step >= C.steps.length - 1) return { label: 'Descargar resultados', act: 'export' };

/* src/remote.js */
/* Cliente de la sala en línea: habla con el servidor y entrega lo mismo que la sala local. */
(function (root) {

      },
      async check(c) { clave = c; try { const r = await call('admin', { a: 'status', clave: c }); return r.ok; } catch (e) { return false; } },
      async startAdmin() { clearInterval(atimer); await refreshAdmin(); atimer = setInterval(refreshAdmin, opts.every || 1500); return !!acache; },
      subscribe(f) { subs.add(f); return () => subs.delete(f); },
      now: () => Date.now()
    };
  }
  root.RemoteHub = { create };
})(typeof self !== 'undefined' ? self : this);

</script>
<script>
/* src/main-docente.js */
(function () {
  const app = document.getElementById('app');
  const ls = { get() { try { return sessionStorage.getItem('ecedu_clave') || ''; } catch (e) { return ''; } }, set(v) { try { sessionStorage.setItem('ecedu_clave', v); } catch (e) { /* sin almacenamiento */ } } };
  let hub;
  async function ask(msg) {
    const c = window.prompt(msg || 'Clave del docente');
    if (c === null) { app.textContent = 'Recarga la página para entrar con la clave del docente.'; return; }
    if (await hub.check(c)) { ls.set(c); begin(); } else ask('Clave incorrecta. Inténtalo de nuevo.');
  }
  hub = RemoteHub.create({ every: 1500, clave: ls.get(), onAuth: () => ask('La clave no es válida. Escríbela de nuevo.') });
  async function begin() {
    if (!(await hub.startAdmin())) { app.textContent = 'No se pudo conectar con el servidor. Recarga la página.'; return; }
    app.textContent = '';
    const host = document.createElement('div'); host.style.height = '100%'; app.append(host);
    const d = DocenteApp(host, hub, { url: location.origin });
    function fit() { const dd = host.querySelector('.doc'); if (!dd) return; const w = host.clientWidth, h = host.clientHeight; dd.style.fontSize = Math.max(10, Math.min(34, Math.min(w / 75, h / 40))) + 'px'; }
    if (window.ResizeObserver) new ResizeObserver(fit).observe(host);
    window.addEventListener('resize', fit); fit();
  }
  (async () => { const c = ls.get(); if (c && await hub.check(c)) begin(); else ask(); })();
})();

</script>

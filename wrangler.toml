name = "ecedu-taller"
main = "src/worker.mjs"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

[[durable_objects.bindings]]
name = "TALLER"
class_name = "Taller"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Taller"]
